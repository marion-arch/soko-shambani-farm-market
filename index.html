<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soko Shambani | Farm Marketplace</title>
    <style>
          /* Responsive Grid for Product Cards */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    padding: 20px;
}

.product-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
}

/* Cookie Popup Styling */
.cookie-banner {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #333;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

/* Mobile Adjustments */
@media (max-width: 600px) {
    header { flex-direction: column; }
    .cookie-banner { flex-direction: column; text-align: center; }
}
    </style>
  
</head>
<body>

    <header>
        <div class="logo">🌿 Soko Shambani</div>
        <nav>
            <input type="text" id="searchBar" placeholder="Search produce..." onkeyup="filterProducts()">
            <select id="categoryFilter" onchange="filterProducts()">
                <option value="all">All Categories</option>
                <option value="vegetables">Vegetables</option>
                <option value="fruits">Fruits</option>
                <option value="grains">Grains</option>
            </select>
        </nav>
    </header>

    <div id="cookiePopup" class="cookie-banner">
        <p>This site uses cookies to enhance your experience as per our 
           <a href="#">Privacy Notice</a>. 
           <button onclick="acceptCookies()">Accept</button>
        </p>
    </div>

    <main>
        <section class="product-grid" id="productGrid">
            <div class="product-card" data-name="tomatoes" data-category="vegetables">
                <img src="tomatoes.jpg" alt="Tomatoes">
                <h3>Fresh Tomatoes</h3>
                <p>KES 150 / kg</p>
                <span class="badge">Vegetables</span>
            </div>
            <div class="product-card" data-name="onions" data-category="vegetables">
                <img src="onions.jpg" alt="Onions">
                <h3>Red Onions</h3>
                <p>KES 120 / kg</p>
                <span class="badge">Vegetables</span>
            </div>
            <div class="product-card" data-name="maize" data-category="grains">
                <img src="maize.jpg" alt="Maize">
                <h3>White Maize</h3>
                <p>KES 5,000 / 90kg</p>
                <span class="badge">Grains</span>
            </div>
        </section>

        <section id="registration">
            <h2>Farmer/Buyer Registration</h2>
            <form id="regForm" onsubmit="return validateForm(event)">
                <input type="text" id="username" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                
                <div class="privacy-box">
                    <input type="checkbox" id="consent" required>
                    <label for="consent">I agree to the <a href="#">Privacy Policy</a> under the Data Protection Act (2019).</label>
                </div>
                
                <button type="submit">Sign Up</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
